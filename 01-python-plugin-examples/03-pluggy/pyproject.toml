[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pluggy-formatters"
version = "0.1.0"
description = "Pluggy example for Python plugins"
requires-python = ">=3.10"
dependencies = ["pluggy>=1.0"]

[tool.setuptools]
packages = ["myapp", "plugins"]

[project.entry-points."myapp"]
# Pluggy can also discover plugins via entry points,
# but for clarity we register them manually in the demo.
